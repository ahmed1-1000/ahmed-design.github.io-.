/* ==========================================================================
   SOUN — نظام التصميم الكامل
   متجر أزياء وأحذية ثلاثي الأبعاد | دعم RTL | وضع داكن وفاتح | متجاوب
   ========================================================================== */

/* ---------- 1. المتغيرات العامة (الوضع الداكن هو الافتراضي) ---------- */
:root {
  --bg: #06060b;
  --bg-2: #0b0b13;
  --surface: #101019;
  --surface-2: #16161f;
  --surface-3: #1d1d29;
  --line: rgba(255, 255, 255, 0.09);
  --line-strong: rgba(255, 255, 255, 0.16);
  --text: #f3f3f7;
  --text-2: #b9bac9;
  --muted: #8b8d9e;
  --accent: #8b5cf6;
  --accent-2: #ec4899;
  --accent-3: #22d3ee;
  --grad: linear-gradient(120deg, #8b5cf6 0%, #ec4899 55%, #f59e0b 100%);
  --grad-soft: linear-gradient(120deg, rgba(139, 92, 246, 0.18), rgba(236, 72, 153, 0.14));
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;
  --radius: 18px;
  --radius-sm: 12px;
  --radius-lg: 28px;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.3);
  --header-h: 74px;
  --font: "Tajawal", "Segoe UI", Tahoma, sans-serif;
  --font-display: "Syne", "Tajawal", sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

[data-theme="light"] {
  --bg: #f6f6fa;
  --bg-2: #ffffff;
  --surface: #ffffff;
  --surface-2: #f1f1f7;
  --surface-3: #e9e9f2;
  --line: rgba(12, 12, 24, 0.1);
  --line-strong: rgba(12, 12, 24, 0.2);
  --text: #14141d;
  --text-2: #43445a;
  --muted: #6d6f85;
  --grad-soft: linear-gradient(120deg, rgba(139, 92, 246, 0.1), rgba(236, 72, 153, 0.08));
  --shadow: 0 18px 50px rgba(30, 20, 70, 0.12);
  --shadow-soft: 0 10px 26px rgba(30, 20, 70, 0.09);
}

/* ---------- 2. إعادة الضبط والأساسيات ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  overflow-x: hidden;
  min-height: 100vh;
  transition: background 0.35s var(--ease), color 0.35s var(--ease);
}

body.no-scroll { overflow: hidden; }

img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, select, textarea { font-family: inherit; font-size: 1rem; color: inherit; }
ul, ol { list-style: none; }
::selection { background: var(--accent); color: #fff; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-2); }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 20px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent); }

:focus-visible { outline: 2px solid var(--accent-3); outline-offset: 3px; }

/* ---------- 3. أدوات مساعدة ---------- */
.container { width: min(1240px, 92%); margin-inline: auto; }
.section { padding: 72px 0; position: relative; }
.section--tight { padding: 48px 0; }
.text-center { text-align: center; }
.muted { color: var(--muted); }
.mt-1 { margin-top: 8px; } .mt-2 { margin-top: 16px; } .mt-3 { margin-top: 24px; } .mt-4 { margin-top: 36px; }
.hidden { display: none !important; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

.section-head { max-width: 720px; margin-bottom: 42px; }
.section-head--center { margin-inline: auto; text-align: center; }

.section-kicker {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 0.86rem; font-weight: 700; letter-spacing: 0.5px;
  color: var(--accent-3);
  background: var(--grad-soft);
  border: 1px solid var(--line);
  padding: 7px 16px; border-radius: 100px; margin-bottom: 16px;
}
.section-kicker::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent-3); box-shadow: 0 0 12px var(--accent-3);
}

.section-title {
  font-size: clamp(1.7rem, 3.6vw, 2.7rem);
  font-weight: 800; line-height: 1.3; letter-spacing: -0.5px;
}
.section-title .grad-text, .grad-text {
  background: var(--grad);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.section-sub { margin-top: 12px; color: var(--text-2); font-size: 1.03rem; }

/* ---------- 4. الأزرار ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 14px 28px; border-radius: 100px;
  font-weight: 700; font-size: 0.98rem; line-height: 1;
  transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease),
    background 0.25s, color 0.25s, border-color 0.25s;
  position: relative; overflow: hidden; white-space: nowrap;
}
.btn svg { width: 19px; height: 19px; }
.btn:hover { transform: translateY(-3px); }
.btn:active { transform: translateY(0) scale(0.98); }

.btn--primary {
  background: var(--grad); color: #fff;
  box-shadow: 0 12px 30px rgba(139, 92, 246, 0.35);
}
.btn--primary:hover { box-shadow: 0 18px 40px rgba(139, 92, 246, 0.5); }

.btn--ghost {
  background: transparent; color: var(--text);
  border: 1.5px solid var(--line-strong);
}
.btn--ghost:hover { border-color: var(--accent); background: var(--grad-soft); }

.btn--light { background: #fff; color: #101019; }
.btn--light:hover { box-shadow: 0 14px 34px rgba(255, 255, 255, 0.22); }

.btn--dark { background: #101019; color: #fff; }
.btn--dark:hover { box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4); }

.btn--whatsapp { background: #25d366; color: #06281a; }
.btn--whatsapp:hover { box-shadow: 0 14px 34px rgba(37, 211, 102, 0.4); }

.btn--sm { padding: 10px 20px; font-size: 0.88rem; }
.btn--lg { padding: 17px 36px; font-size: 1.05rem; }
.btn--block { width: 100%; }
.btn--danger { background: rgba(239, 68, 68, 0.14); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.4); }
.btn:disabled { opacity: 0.5; pointer-events: none; }

/* ---------- 5. الشارات ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.74rem; font-weight: 800; letter-spacing: 0.3px;
  padding: 6px 13px; border-radius: 100px; line-height: 1;
}
.badge--new { background: #22d3ee; color: #04222a; }
.badge--sale { background: var(--grad); color: #fff; }
.badge--best { background: #f59e0b; color: #2b1a02; }
.badge--off { background: var(--danger); color: #fff; }
.badge--muted { background: var(--surface-3); color: var(--text-2); }

/* ---------- 6. شاشة التحميل ---------- */
.preloader {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  transition: opacity 0.6s var(--ease), visibility 0.6s;
}
.preloader.is-done { opacity: 0; visibility: hidden; }
.preloader__logo {
  font-family: var(--font-display); font-size: clamp(2.4rem, 8vw, 4rem);
  font-weight: 800; letter-spacing: 6px;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: pulseGlow 1.6s ease-in-out infinite;
}
.preloader__bar { width: 190px; height: 4px; background: var(--surface-3); border-radius: 100px; overflow: hidden; }
.preloader__bar i {
  display: block; height: 100%; width: 40%; border-radius: 100px;
  background: var(--grad); animation: loadingSlide 1.1s var(--ease) infinite;
}
.preloader__text { color: var(--muted); font-size: 0.9rem; letter-spacing: 1px; }

@keyframes loadingSlide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
@keyframes pulseGlow { 0%, 100% { opacity: 1; filter: drop-shadow(0 0 0 transparent); } 50% { opacity: 0.75; filter: drop-shadow(0 0 22px rgba(139, 92, 246, 0.8)); } }

/* ---------- 7. الشريط العلوي والهيدر ---------- */
.topbar {
  background: var(--grad); color: #fff;
  font-size: 0.85rem; font-weight: 600;
  padding: 9px 0; overflow: hidden; position: relative; z-index: 60;
}
.topbar .container { display: flex; align-items: center; justify-content: center; gap: 26px; flex-wrap: wrap; }
.topbar a { display: inline-flex; align-items: center; gap: 7px; }
.topbar a:hover { text-decoration: underline; }
.topbar svg { width: 15px; height: 15px; }

.site-header {
  position: sticky; top: 0; z-index: 100;
  background: color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid transparent;
  transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
}
.site-header.is-stuck {
  border-bottom-color: var(--line);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
}
.header-inner {
  height: var(--header-h);
  display: flex; align-items: center; justify-content: space-between; gap: 22px;
}

.logo { display: flex; align-items: center; gap: 11px; flex-shrink: 0; }
.logo__mark {
  width: 42px; height: 42px; border-radius: 13px;
  background: var(--grad); color: #fff;
  display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 1.25rem;
  box-shadow: 0 8px 22px rgba(139, 92, 246, 0.45);
  transform: rotate(-6deg);
  transition: transform 0.4s var(--ease);
}
.logo:hover .logo__mark { transform: rotate(6deg) scale(1.06); }
.logo__text { display: flex; flex-direction: column; line-height: 1.15; }
.logo__name { font-family: var(--font-display); font-weight: 800; font-size: 1.42rem; letter-spacing: 3px; }
.logo__tag { font-size: 0.66rem; color: var(--muted); letter-spacing: 0.6px; font-weight: 600; }

.main-nav { display: flex; align-items: center; gap: 6px; }
.nav-link {
  position: relative; padding: 9px 15px; border-radius: 100px;
  font-weight: 600; font-size: 0.96rem; color: var(--text-2);
  transition: color 0.25s, background 0.25s;
}
.nav-link:hover { color: var(--text); background: var(--surface-2); }
.nav-link.is-active { color: var(--text); }
.nav-link.is-active::after {
  content: ""; position: absolute; bottom: 3px; inset-inline: 15px;
  height: 2.5px; border-radius: 4px; background: var(--grad);
}

.nav-actions { display: flex; align-items: center; gap: 8px; }
.icon-btn {
  position: relative; width: 43px; height: 43px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--line);
  transition: transform 0.25s var(--ease), background 0.25s, border-color 0.25s;
}
.icon-btn:hover { transform: translateY(-2px); background: var(--surface-3); border-color: var(--accent); }
.icon-btn svg { width: 20px; height: 20px; color: var(--text); }
.icon-btn .count {
  position: absolute; top: -5px; inset-inline-start: -5px;
  min-width: 19px; height: 19px; padding: 0 5px;
  background: var(--grad); color: #fff; border-radius: 100px;
  font-size: 0.68rem; font-weight: 800;
  display: grid; place-items: center; line-height: 1;
  border: 2px solid var(--bg);
}
.icon-btn .count:empty, .icon-btn .count[data-count="0"] { display: none; }

.mobile-toggle { display: none; }

/* القائمة الجانبية للموبايل */
.mobile-menu {
  position: fixed; inset: 0; z-index: 300;
  pointer-events: none; visibility: hidden;
}
.mobile-menu__backdrop {
  position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6);
  opacity: 0; transition: opacity 0.35s;
}
.mobile-menu__panel {
  position: absolute; top: 0; bottom: 0; inset-inline-end: 0;
  width: min(330px, 86vw); background: var(--bg-2);
  border-inline-start: 1px solid var(--line);
  padding: 26px 22px; transform: translateX(-100%);
  transition: transform 0.4s var(--ease);
  display: flex; flex-direction: column; gap: 6px; overflow-y: auto;
}
[dir="rtl"] .mobile-menu__panel { transform: translateX(100%); }
.mobile-menu.is-open { pointer-events: auto; visibility: visible; }
.mobile-menu.is-open .mobile-menu__backdrop { opacity: 1; }
.mobile-menu.is-open .mobile-menu__panel { transform: translateX(0); }
.mobile-menu__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.mobile-menu__link {
  padding: 14px 16px; border-radius: var(--radius-sm);
  font-weight: 700; font-size: 1.05rem; color: var(--text-2);
  display: flex; align-items: center; gap: 12px;
  transition: background 0.25s, color 0.25s, transform 0.25s;
}
.mobile-menu__link:hover, .mobile-menu__link.is-active {
  background: var(--grad-soft); color: var(--text); transform: translateX(-6px);
}
[dir="rtl"] .mobile-menu__link:hover, [dir="rtl"] .mobile-menu__link.is-active { transform: translateX(6px); }
.mobile-menu__phone {
  margin-top: auto; padding: 16px; border-radius: var(--radius-sm);
  background: var(--grad); color: #fff; text-align: center; font-weight: 800;
  display: flex; flex-direction: column; gap: 4px;
}
.mobile-menu__phone small { font-weight: 500; opacity: 0.85; font-size: 0.78rem; }

/* طبقة البحث */
.search-overlay {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(4, 4, 10, 0.82); backdrop-filter: blur(10px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 12vh 20px 20px;
  opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s;
}
.search-overlay.is-open { opacity: 1; visibility: visible; }
.search-box { width: min(660px, 100%); transform: translateY(-18px); transition: transform 0.35s var(--ease); }
.search-overlay.is-open .search-box { transform: translateY(0); }
.search-field {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1.5px solid var(--line-strong);
  border-radius: 100px; padding: 6px 8px 6px 22px;
  box-shadow: var(--shadow);
}
[dir="rtl"] .search-field { padding: 6px 22px 6px 8px; }
.search-field svg { width: 22px; height: 22px; color: var(--muted); flex-shrink: 0; }
.search-field input {
  flex: 1; background: none; border: none; outline: none;
  font-size: 1.08rem; padding: 12px 0; font-weight: 500;
}
.search-field input::placeholder { color: var(--muted); }
.search-hint { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 14px; }
.search-results {
  margin-top: 14px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
  max-height: 52vh; overflow-y: auto;
}
.search-result-item {
  display: flex; align-items: center; gap: 14px; padding: 13px 18px;
  border-bottom: 1px solid var(--line); transition: background 0.2s;
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: var(--surface-2); }
.search-result-item .mini-art {
  width: 46px; height: 46px; border-radius: 11px; flex-shrink: 0;
  display: grid; place-items: center; color: rgba(255, 255, 255, 0.92);
}
.search-result-item .mini-art svg { width: 60%; height: 60%; }
.search-result-item .sr-name { font-weight: 700; font-size: 0.95rem; }
.search-result-item .sr-meta { font-size: 0.78rem; color: var(--muted); }
.search-result-item .sr-price { margin-inline-start: auto; font-weight: 800; color: var(--accent-3); font-size: 0.92rem; }
.search-empty { padding: 26px; text-align: center; color: var(--muted); }

/* ---------- 8. الهيرو ثلاثي الأبعاد ---------- */
.hero {
  position: relative; min-height: calc(100vh - var(--header-h) - 40px);
  display: flex; align-items: center;
  overflow: hidden; padding: 70px 0;
  background:
    radial-gradient(900px 500px at 85% 15%, rgba(139, 92, 246, 0.22), transparent 60%),
    radial-gradient(700px 480px at 10% 85%, rgba(236, 72, 153, 0.16), transparent 60%),
    radial-gradient(600px 400px at 50% 50%, rgba(34, 211, 238, 0.08), transparent 65%),
    var(--bg);
}
#bg-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  z-index: 1; pointer-events: none;
}
.hero__grid-lines {
  position: absolute; inset: 0; z-index: 0; opacity: 0.35;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, #000 40%, transparent 100%);
  -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, #000 40%, transparent 100%);
}
.hero .container { position: relative; z-index: 3; }
.hero__content { max-width: 720px; }

.hero__badge {
  display: inline-flex; align-items: center; gap: 9px;
  background: var(--grad-soft); border: 1px solid var(--line-strong);
  padding: 9px 20px; border-radius: 100px;
  font-size: 0.87rem; font-weight: 700; color: var(--text);
  backdrop-filter: blur(8px); margin-bottom: 24px;
}
.hero__badge .dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--success);
  animation: blink 1.4s infinite;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

.hero__title {
  font-size: clamp(2.3rem, 6vw, 4.4rem);
  font-weight: 900; line-height: 1.18; letter-spacing: -1.5px;
}
.hero__title .brand {
  font-family: var(--font-display); letter-spacing: 4px;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero__sub {
  margin-top: 20px; font-size: clamp(1rem, 1.6vw, 1.18rem);
  color: var(--text-2); max-width: 590px;
}
.hero__cta { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 34px; }

.hero__stats {
  display: flex; flex-wrap: wrap; gap: 34px; margin-top: 52px;
  padding-top: 30px; border-top: 1px solid var(--line);
}
.hero__stat b {
  display: block; font-family: var(--font-display);
  font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 800;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero__stat span { font-size: 0.86rem; color: var(--muted); font-weight: 600; }

.hero__scroll {
  position: absolute; bottom: 26px; inset-inline-start: 50%;
  transform: translateX(50%); z-index: 4;
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  color: var(--muted); font-size: 0.75rem; letter-spacing: 2px; font-weight: 600;
}
.hero__scroll i {
  width: 24px; height: 40px; border: 2px solid var(--line-strong);
  border-radius: 100px; position: relative; display: block;
}
.hero__scroll i::after {
  content: ""; position: absolute; top: 7px; inset-inline-start: 50%;
  width: 4px; height: 8px; margin-inline-start: -2px;
  background: var(--accent-3); border-radius: 4px;
  animation: scrollDot 1.6s infinite;
}
@keyframes scrollDot { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(14px); opacity: 0; } 100% { opacity: 0; } }

.hero__3d-tag {
  position: absolute; z-index: 4; inset-inline-end: 6%; top: 22%;
  display: flex; align-items: center; gap: 9px;
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  border: 1px solid var(--line-strong); border-radius: 100px;
  padding: 10px 18px; font-size: 0.8rem; font-weight: 700;
  backdrop-filter: blur(10px); box-shadow: var(--shadow-soft);
  animati
