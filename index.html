<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>AHMED DESIGN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
@keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(-45deg, #000000, #1a0033, #4b0082, #ffd700);
    background-size: 400% 400%;
    animation: bgMove 10s ease infinite;
    color: #fff;
}
header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 1rem 1.5rem; background: rgba(0,0,0,0.8);
    display: flex; justify-content: space-between; align-items: center;
    z-index: 100; border-bottom: 1px solid rgba(255,215,0,0.3);
}
.logo { font-size: 1.5rem; font-weight: 900; color: #ffd700; }
.menu-btn {
    width: 2.5rem; height: 2.5rem; background: #1a0033;
    border: 1px solid #ffd700; border-radius: 50%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    cursor: pointer; gap: 3px;
}
.menu-btn span { width: 4px; height: 4px; background: #ffd700; border-radius: 50%; }

#drawer {
    position: fixed; top: 0; bottom: 0; right: -250px; width: 250px;
    background: #0d001a; transition: 0.3s; z-index: 101;
    padding-top: 5rem; border-left: 1px solid #ffd700;
}
#drawer.show { right: 0; }
#drawer ul { list-style: none; padding: 0; margin: 0; }
#drawer li { padding: 1rem; border-bottom: 1px solid #333; cursor: pointer; font-weight: bold; }
#drawer li:hover { background: rgba(255,215,0,0.2); color: #ffd700; }

.container { max-width: 800px; margin: auto; padding: 6rem 1rem 2rem; }
.card {
    background: rgba(15, 0, 30, 0.7); border: 1px solid rgba(255,215,0,0.3);
    border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem;
}
input, textarea {
    width: 100%; padding: 0.8rem; margin: 0.5rem 0;
    background: rgba(255,255,255,0.1); border: 1px solid #555;
    color: #fff; border-radius: 6px; box-sizing: border-box;
}
button {
    background: #ffd700; color: #000; font-weight: bold;
    padding: 0.8rem; border: none; border-radius: 6px; width: 100%; cursor: pointer;
}
.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.gallery img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; border: 2px solid #ffd700; cursor: pointer; }

/* Modal للصور */
#modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000;
}
#modal img { max-width: 90%; max-height: 80%; border-radius: 8px; border: 2px solid #ffd700; }
#modal span { position: absolute; top: 20px; right: 30px; font-size: 2.5rem; color: #ffd700; cursor: pointer; }

footer { text-align: center; padding: 2rem; background: #000; }
footer a { color: #00ff66; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>

<header>
    <div class="logo">AHMED DESIGN</div>
    <div class="menu-btn" id="menuBtn">
        <span></span><span></span><span></span>
    </div>
</header>

<nav id="drawer">
    <ul>
        <li onclick="alert('اللغة العربية مفعلة')">🈳 اللغة / Language</li>
        <li onclick="location.reload()">🔄 تحديث الصفحة</li>
    </ul>
</nav>

<div id="modal">
    <span onclick="document.getElementById('modal').style.display='none'">&times;</span>
    <img id="modalImg" src="">
</div>

<div class="container">
    <div class="card">
        <h2>طلب تصميم</h2>
        <input type="text" placeholder="العنوان">
        <textarea placeholder="اكتب تفاصيل طلبك..."></textarea>
        <button>إرسال الطلب</button>
    </div>

    <div class="card">
        <h2>معرض الصور (اضغط لتكبير الصورة)</h2>
        <div class="gallery">
            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400" onclick="openModal(this.src)">
            <img src="https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=400" onclick="openModal(this.src)">
            <img src="https://images.unsplash.com/photo-1618172193763-c511deb635ca?w=400" onclick="openModal(this.src)">
        </div>
    </div>

    <div class="card">
        <h2>رفع تصميم</h2>
        <input type="file" accept="image/*">
        <button style="margin-top:10px;">رفع الصورة</button>
    </div>
</div>

<footer>
    <a href="https://wa.me/201122160714" target="_blank">استفسار عبر واتساب: 01122160714</a>
</footer>

<script>
const menuBtn = document.getElementById('menuBtn');
const drawer = document.getElementById('drawer');
menuBtn.onclick = () => drawer.classList.toggle('show');

function openModal(src) {
    document.getElementById('modalImg').src = src;
    document.getElementById('modal').style.display = 'flex';
}
</script>

</body>
</html>
