<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<title>AHMED DESIGN</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- استدعاء خط فخم جداً (Cairo) -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">

/* ==== الخلفية المتحركة والجسيمات العائمة ==== */
@keyframes gradientAnimation {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

@keyframes floatOrbs {
    0% { transform: translateY(0px) scale(1); }
    50% { transform: translateY(-30px) scale(1.1); }
    100% { transform: translateY(0px) scale(1); }
}

body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    color: #fff;
    background: linear-gradient(-45deg, #05000a, #1a0033, #3b0066, #120024, #1f0036);
    background-size: 400% 400%;
    animation: gradientAnimation 12s ease infinite;
    overflow-x: hidden;
}

/* دوائر عائمة في الخلفية (حاجات طالعة ونازلة) */
.bg-orbs {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    overflow: hidden; z-index: -1; pointer-events: none;
}
.orb {
    position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.4;
    animation: floatOrbs 8s ease-in-out infinite;
}
.orb1 { width: 300px; height: 300px; background: #8a2be2; top: 10%; left: 10%; animation-delay: 0s; }
.orb2 { width: 350px; height: 350px; background: #ffd700; bottom: 10%; right: 10%; animation-delay: 3s; opacity: 0.25; }
.orb3 { width: 250px; height: 250px; background: #4b0082; top: 50%; left: 60%; animation-delay: 5s; }

.container { max-width: 1200px; margin: auto; padding: 1rem; position: relative; z-index: 2; }
.flex { display: flex; align-items: center; gap: 1rem; }

header {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 1rem 2rem;
    background: rgba(5, 0, 10, 0.75);
    backdrop-filter: blur(12px);
    z-index: 1000;
    border-bottom: 1px solid rgba(255, 215, 0, 0.15);
}
.logo { font-size: 1.7rem; font-weight: 900; color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.5); }

/* شاشة الترحيب */
.welcome {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #05000a;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    z-index: 9999; font-size: 2.2rem; text-align: center; color: #fff;
    transition: opacity 0.6s ease, visibility 0.6s ease;
}
.welcome.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }
.welcome .sub { font-size: 1.2rem; color: #ffd700; margin-top: 10px; font-weight: 600; }
.greet { font-size: 1.8rem; margin-left: .5rem; }

/* زر القائمة */
.menu-btn {
    position: fixed; top: 1.2rem; right: 1.2rem;
    width: 3rem; height: 3rem;
    background: rgba(20, 5, 35, 0.85);
    border: 1px solid #ffd700;
    border-radius: 50%;
    display: flex; justify-content: center; align-items: center;
    cursor: pointer; z-index: 1002;
    box-shadow: 0 0 10px rgba(255,215,0,0.3);
}
.menu-btn span { width: 5px; height: 5px; background: #ffd700; border-radius: 50%; margin: 2px; }

/* القائمة الجانبية */
#drawer {
    position: fixed; top: 0; bottom: 0; right: -300px; width: 280px;
    background: rgba(12, 2, 22, 0.98);
    backdrop-filter: blur(15px);
    transition: right .35s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1003; padding-top: 5rem;
    border-left: 1px solid rgba(255, 215, 0, 0.3);
    box-shadow: -5px 0 25px rgba(0,0,0,0.8);
}
#drawer.show { right: 0; }
#drawer ul { list-style: none; padding: 0; margin: 0; }
#drawer li {
    padding: 1.3rem 1.5rem;
    border-bottom: 1px solid rgba(255,215,0,0.15);
    cursor: pointer; font-weight: 700; color: #fff;
    transition: 0.2s;
}
#drawer li:hover { background: rgba(255,215,0,0.15); color: #ffd700; padding-right: 1.8rem; }

section { min-height: 100vh; padding: 7rem 1rem 2rem; }
section h2 { font-size: 2.2rem; color: #ffd700; margin-bottom: 1rem; font-weight: 800; text-shadow: 0 0 15px rgba(255,215,0,0.3); }

.card {
    background: rgba(15, 5, 25, 0.65);
    border: 1px solid rgba(255, 215, 0, 0.25);
    border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}
section textarea, section input[type="text"] {
    width: 100%; padding: 1rem; margin: 0.6rem 0;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 215, 0, 0.3); color: #fff;
    border-radius: 8px; outline: none; font-family: 'Cairo', sans-serif;
    box-sizing: border-box; transition: 0.3s;
}
section input[type="text"]:focus, section textarea:focus {
    border-color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,0.2);
}

.file-upload-wrapper {
    position: relative; overflow: hidden; display: inline-block; width: 100%;

.file-upload-wrapper input[type="file"] {

.custom-file-btn {
    display: block; width: 100%; padding: 1rem;

    cursor: pointer; transition: 0.3s; box-sizing: border-box;
}
.custom-file-btn:hover { background: rgba(255, 215, 0, 0.2); }
